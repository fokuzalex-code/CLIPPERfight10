<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D8322B"><link rel="manifest" href="/manifest.webmanifest">
<title>Clipper.fight</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Big+Shoulders+Display:wght@800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--ring:#E8ECF2;--ink:#12151C;--red:#D8322B;--blue:#2447D6;--gold:#E3A82B}
body{background:var(--ring);color:var(--ink);font-family:Archivo,system-ui,sans-serif;font-size:16px;min-height:100dvh}
.display{font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:900;letter-spacing:.01em}
.field{width:100%;min-height:48px;font-size:16px;background:#fff;border:2px solid var(--ink);padding:.6rem .8rem;border-radius:2px}
.field:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.tab{min-height:52px}.tab[aria-selected=true]{background:var(--ink);color:#fff}
.dock{position:sticky;bottom:0;background:var(--ring);padding:.75rem 0 calc(.75rem + env(safe-area-inset-bottom));border-top:2px solid var(--ink)}
.btn{min-height:52px;display:flex;align-items:center;justify-content:center}
button:disabled{opacity:.55}
</style></head>
<body>
<main class="max-w-xl mx-auto px-4 pt-6">
  <h1 class="display text-5xl leading-none">CLIPPER<span style="color:var(--red)">.</span>FIGHT</h1>
  <p class="mt-2">Clips verticales de Kick, Twitch o de tu galería, listos para publicar.</p>

  <section class="mt-6 border-2 border-[var(--ink)] bg-[#F7F9FC]">
    <div class="grid grid-cols-2" role="tablist">
      <button class="tab display text-xl" role="tab" aria-selected="true" data-tab="url">Enlace</button>
      <button class="tab display text-xl border-l-2 border-[var(--ink)]" role="tab" aria-selected="false" data-tab="file">Mi video</button>
    </div>
    <div class="p-4 space-y-4">
      <div id="p-url"><label for="url" class="font-semibold">VOD o clip de Kick / Twitch</label>
        <input id="url" class="field mt-1" inputmode="url" autocapitalize="off" placeholder="https://kick.com/…"></div>
      <div id="p-file" hidden><label for="file" class="font-semibold">Video de la galería (MP4 o MKV)</label>
        <input id="file" type="file" accept="video/*,.mkv" class="field mt-1 pt-3"></div>
      <div class="grid grid-cols-3 gap-3">
        <div><label for="n" class="text-sm font-semibold">Clips</label><input id="n" type="number" inputmode="numeric" min="1" max="10" value="5" class="field"></div>
        <div><label for="min_s" class="text-sm font-semibold">Mín. seg</label><input id="min_s" type="number" inputmode="numeric" value="20" class="field"></div>
        <div><label for="max_s" class="text-sm font-semibold">Máx. seg</label><input id="max_s" type="number" inputmode="numeric" value="60" class="field"></div>
      </div>
      <div><label for="quality" class="font-semibold">Calidad</label>
        <select id="quality" class="field mt-1"><option value="rapido">Rápido (720p, ideal en el teléfono)</option><option value="equilibrado">Equilibrado (1080p)</option><option value="alta">Alta calidad (1080p, lento)</option></select></div>
      <div><label for="mode" class="font-semibold">Encuadre vertical</label>
        <select id="mode" class="field mt-1"><option value="fit">Video completo con fondo difuminado</option><option value="fill">Seguir la cara (recorte 9:16)</option></select></div>
      <label class="flex items-center gap-3 min-h-[48px] font-semibold"><input id="bar" type="checkbox" checked class="w-6 h-6"> Barra de progreso animada en el clip</label>
      <div><label for="watermark" class="font-semibold">Marca de agua (texto)</label><input id="watermark" class="field mt-1" placeholder="@tucanal"></div>
      <div><label for="hashtags" class="font-semibold">Hashtags</label><input id="hashtags" class="field mt-1" value="#fokuzrd #kick #gaming"></div>
    </div>
  </section>
  <section id="out" class="mt-8 space-y-6"></section>
  <section class="mt-8 pb-8"><h2 class="display text-3xl">Recientes</h2><div id="lib" class="mt-2 space-y-2"><p class="text-sm">Aún no hay trabajos.</p></div></section>
</main>
<div class="dock"><div class="max-w-xl mx-auto px-4">
  <div id="bar" hidden class="h-3 mb-2 bg-white border-2 border-[var(--ink)]"><div id="fill" class="h-full" style="width:0;background:var(--blue)"></div></div>
  <p id="msg" class="text-sm mb-2" role="status"></p>
  <button id="go" class="btn display text-2xl w-full text-white" style="background:var(--red)">GENERAR CLIPS</button>
</div></div>
<script>
const $=s=>document.querySelector(s);let tab='url',lock=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));
  $('#p-url').hidden=tab!=='url';$('#p-file').hidden=tab!=='file'});
$('#go').onclick=async()=>{
  const f=new FormData();
  if(tab==='url')f.append('url',$('#url').value.trim());else if($('#file').files[0])f.append('file',$('#file').files[0]);
  ['n','min_s','max_s','mode','quality','watermark','hashtags'].forEach(k=>f.append(k,$('#'+k).value));f.append('bar',$('#bar').checked?'1':'');
  $('#go').disabled=true;$('#out').innerHTML='';$('#msg').textContent='Enviando…';
  try{lock=await navigator.wakeLock?.request('screen')}catch(e){}
  try{const r=await fetch('/api/jobs',{method:'POST',body:f});
    if(!r.ok){$('#msg').textContent=(await r.json()).detail;end();return}
    const{id}=await r.json();localStorage.setItem('job',id);poll(id)}
  catch(e){$('#msg').textContent='No se pudo conectar con el servidor';end()}};
function end(){loadLib();$('#go').disabled=false;$('#bar').hidden=true;lock?.release?.();lock=null}
async function poll(id){
  try{const r=await fetch('/api/jobs/'+id);if(!r.ok)throw 0;const j=await r.json();
    $('#bar').hidden=false;$('#fill').style.width=Math.round(j.progress*100)+'%';
    $('#msg').textContent=j.msg+' ('+Math.round(j.progress*100)+'%)';
    if(j.status==='done'){end();$('#msg').textContent='Listo: '+j.clips.length+' clips';show(id,j.clips)}
    else if(j.status==='error'){end()}
    else setTimeout(poll,2000,id)}
  catch(e){setTimeout(poll,4000,id)}}
function show(id,cs){const v=Date.now();window.CL=cs;$('#out').innerHTML=(cs.length?`<a class="btn display text-xl text-white" style="background:var(--ink)" href="/api/jobs/${id}/zip">DESCARGAR TODOS (ZIP)</a>`:'')+(cs.map((c,i)=>`
  <article class="border-2 border-[var(--ink)] bg-[#F7F9FC]">
    <video src="/files/${id}/${c.file}?v=${v}" controls playsinline preload="metadata" class="w-full bg-black aspect-[9/16] max-h-[75dvh]"></video>
    <div class="p-4"><div class="flex justify-between items-start gap-3">
      <h2 class="display text-2xl leading-tight">${esc(c.title)}</h2>
      <span class="display text-3xl px-2" style="background:var(--gold)" title="Potencial viral estimado">${c.score}</span></div>
      <p class="mt-2" style="color:var(--blue)">${esc(c.tags)}</p>
      <div class="grid grid-cols-2 gap-3 mt-3">
        <button class="btn display text-xl text-white" style="background:var(--blue)" onclick="share('${id}','${c.file}',${i})">COMPARTIR</button>
        <a class="btn display text-xl text-white" style="background:var(--ink)" href="/files/${id}/${c.file}" download>GUARDAR</a></div>
      <details class="mt-3"><summary class="min-h-[48px] flex items-center font-semibold">Ajustar recorte</summary>
        <div class="grid grid-cols-2 gap-3"><div><label class="text-sm">Inicio (seg)</label><input id="s${i}" type="number" inputmode="numeric" class="field" value="${c.start}"></div>
        <div><label class="text-sm">Duración (seg)</label><input id="d${i}" type="number" inputmode="numeric" class="field" value="${c.dur}"></div></div>
        <button class="btn display text-xl w-full mt-3 text-white" style="background:var(--red)" onclick="redo('${id}',${i})">RECORTAR DE NUEVO</button></details>
    </div></article>`).join('')||'<p>No se encontraron momentos. Prueba con un video más largo.</p>')}
async function redo(id,i){const f=new FormData();f.append('start',$('#s'+i).value);f.append('dur',$('#d'+i).value);
  $('#go').disabled=true;await fetch(`/api/jobs/${id}/clips/${i}`,{method:'POST',body:f});poll(id)}
async function loadLib(){try{const l=await(await fetch('/api/jobs')).json();if(!l.length)return;
  $('#lib').innerHTML=l.map(j=>`<div class="flex gap-2"><button class="field text-left" onclick="poll('${j.id}')">${j.status==='done'?j.n+' clips · '+esc(j.title||'sin título'):esc(j.status)}</button>
  <button class="field !w-20" aria-label="Borrar" onclick="del('${j.id}')">Borrar</button></div>`).join('')}catch(e){}}
async function del(id){if(confirm('¿Borrar este trabajo y sus clips?')){await fetch('/api/jobs/'+id,{method:'DELETE'});$('#out').innerHTML='';loadLib()}}
async function share(id,file,i){
  const c=window.CL[i],u=`/files/${id}/${file}`;
  try{const b=await(await fetch(u)).blob(),f=new File([b],file,{type:'video/mp4'});
    if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f],title:c.title,text:c.title+' '+c.tags});
    else location.href=u}catch(e){}}
loadLib();const last=localStorage.getItem('job');if(last)poll(last);
</script></body></html>
